[package]
name = "crossref-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = [
    "Emil Lindfors <emil@lindfors.no>",
    "Matthias Seitz <matthias.seitz@outlook.de>",
]
description = "An async Rust client for the Crossref REST API"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EmilLindfors/crossref-client"
documentation = "https://docs.rs/crossref-client"
keywords = ["crossref", "doi", "api-client", "bibliography"]
categories = ["api-bindings", "science"]
exclude = ["/.github"]

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
async-iterator = "2.3"
percent-encoding = "2.3"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }
clap = { version = "4.6", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = "0.3"

[features]
cli = [
    "dep:clap",
    "dep:tracing-subscriber",
    "tokio/macros",
    "tokio/rt-multi-thread",
]

[[bin]]
name = "crossref"
path = "src/bin/crossref/main.rs"
required-features = ["cli"]
